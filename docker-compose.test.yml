services:
  # ---------- Test DB ----------
  test-db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
      - "5434:5432"
    volumes:
      - test-db-volume:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 5s
      retries: 5
      timeout: 5s

  # ---------- API Test Container ----------
  api-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://test_user:test_password@test-db:5432/test_db
      JWT_SECRET: testsecret
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: test
    links:
      - test-db
    command: ["npm", "run", "test:docker"]

volumes:
  test-db-volume:
