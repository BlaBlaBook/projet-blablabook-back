name: Deploy Blablabook API

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run tests inside docker container
        run: npm run test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Set up QEMU for cross-platform builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3️⃣ Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5️⃣ Build and push multi-arch Docker image (ARM64)
      - name: Build and push Docker image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f Dockerfile \
            --build-arg DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/blablabook-api:latest \
            --push .

      # 6️⃣ SSH deploy to server with safe migration
      - name: SSH deploy to server
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /srv/blablabook

            echo "Pulling latest image..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/blablabook-api:latest

            # Backup current container
            echo "Backing up current container..."
            docker tag ${{ secrets.DOCKERHUB_USERNAME }}/blablabook-api:latest \
                      ${{ secrets.DOCKERHUB_USERNAME }}/blablabook-api:backup || true

            # Run migrations in a temporary container
            echo "Running migrations..."
            if docker run --rm \
                -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
                ${{ secrets.DOCKERHUB_USERNAME }}/blablabook-api:latest npx prisma migrate deploy; then
              
              echo "Migrations succeeded. Restarting API..."

              # Stop and remove old container
              docker stop blablabook-api || true
              docker rm blablabook-api || true

              # Start new container on localhost only
              docker run -d --restart unless-stopped \
                --name blablabook-api \
                -p 127.0.0.1:${{ secrets.PORT }}:${{ secrets.PORT }} \
                -e PORT=${{ secrets.PORT }} \
                -e ALLOWED_ORIGINS='${{ secrets.ALLOWED_ORIGINS }}' \
                -e FRONTEND_URL='${{ secrets.FRONTEND_URL }}' \
                -e JWT_SECRET='${{ secrets.JWT_SECRET }}' \
                -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
                -e NODE_ENV='${{ secrets.NODE_ENV }}' \
                -e RESEND_API_KEY='${{ secrets.RESEND_API_KEY }}' \
                -e RESEND_DOMAIN_NAME='${{ secrets.RESEND_DOMAIN_NAME }}' \
                -e RESEND_EMAIL_RECEIVER='${{ secrets.RESEND_EMAIL_RECEIVER }}' \
                -e GOOGLE_BOOKS_API_KEY='${{ secrets.GOOGLE_BOOKS_API_KEY }}' \
                -e GOOGLE_CLIENT_ID='${{ secrets.GOOGLE_CLIENT_ID }}' \
                -e GOOGLE_CLIENT_SECRET='${{ secrets.GOOGLE_CLIENT_SECRET }}' \
                ${{ secrets.DOCKERHUB_USERNAME }}/blablabook-api:latest

              # Clean up old images and builder cache
              docker image prune -f
              docker builder prune -f

              echo "✅ Deployment complete!"

            else
              echo "❌ Migrations failed! Keeping old container running."
              exit 1
            fi
